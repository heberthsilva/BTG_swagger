<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BTG Developer APIs</title>

<link rel="stylesheet"
      href="swagger-ui.css"/>

<style>

body {

    margin: 0;

    font-family: Arial, sans-serif;

}

header {

    background: #1d3557;

    color: white;

    padding: 16px 25px;

    font-size: 24px;

    font-weight: bold;

}

</style>

</head>


<body>


<header>

BTG Developer APIs

</header>


<div id="swagger-ui"></div>


<script src="swagger-ui-bundle.js"></script>

<script src="swagger-ui-standalone-preset.js"></script>


<script>


window.onload = function() {


    SwaggerUIBundle({

        url: "api-consolidada.yaml",

        dom_id: "#swagger-ui",

        deepLinking: true,

        displayOperationId: false,

        defaultModelsExpandDepth: 1,

        defaultModelExpandDepth: 1,

        docExpansion: "list",

        filter: true,

        persistAuthorization: true,

        presets: [

            SwaggerUIBundle.presets.apis,

            SwaggerUIStandalonePreset

        ],

        layout: "BaseLayout"

    });


};


</script>


</body>

</html>
